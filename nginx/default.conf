server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container health check target
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend API. Resolving through Docker DNS at request time (instead of at startup)
    # means nginx keeps working if the api container restarts and changes IP.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # Hashed build assets: safe to cache for a long time
    location ^~ /static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Other public assets (favicons, resume, images)
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|pdf|woff2?|ttf)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Always revalidate the app shell so deploys show up immediately
    location = /index.html {
        expires -1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
