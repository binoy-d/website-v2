name: binoy-co

services:
  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
    extra_hosts:
      # Lets the api reach services published on the Docker host (e.g. BookOrbit on :3000)
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
